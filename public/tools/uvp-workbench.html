  .hub-embedded .uvp-theme-toggle{ display:none; }
  html,body{ background:var(--bg); }
  body{

  textarea, input, select { background:var(--bg-panel); color:var(--ink); border-color:var(--line); }

  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  .tab-underline{ position:relative; }
  .tab-underline.active::after{
    content:"";
    position:absolute; left:0.9rem; right:0.9rem; bottom:-1px; height:2px;
    background:var(--wine);
    border-radius:2px;
  }
  .copy-flash{ animation: flash-bg 0.5s ease-out; }
  @keyframes flash-bg{ 0%{ background:var(--gold-soft);} 100%{ background:transparent; } }
  .field-num{
    font-family:'IBM Plex Serif', serif;
    font-size:0.72rem;
    color:var(--ink-faint);
    letter-spacing:0.02em;

const SECTION_SPEC = {

function briefText(form) {
  const lines = [
    `Industry: ${form.industry}`,
    `Target customer: ${form.target}`,
    `Customer's pain: ${form.pain}`,
    `Product / solution: ${form.product}`,
    `Main outcome: ${form.benefit}`,
    `Differentiator: ${form.differentiator}`,
  ];
  if (form.cta.trim()) lines.push(`Desired call to action: ${form.cta}`);
  if (form.competitor.trim()) lines.push(`Main competitor: ${form.competitor}`);
  return lines.join("\n");
}

function buildPrompt(form, lang, sections, avoid) {
  const specs = sections.map((s) => "- " + SECTION_SPEC[s]).join("\n");
  const avoidBlock = avoid
    ? `\n7. The student already saw these versions and didn't like them. Take a clearly different angle: new images, new structure, new wording. Don't reuse their ideas or phrases:\n${avoid}\n`
    : "";
  return `You are a senior direct-response copywriter who works with small businesses in Moldova. A student entrepreneur wrote this rough brief. It is their raw notes, often generic or clumsy:

<brief>
${briefText(form)}
</brief>

Write the copy in ${LANG_FULL[lang]}. Write natively, the way a local copywriter would, never like a translation. Tone of voice: ${TONE_GUIDE[form.tone] || TONE_GUIDE.friendly}.

Rules:
1. Don't paste the brief. Treat it as raw notes: find the real insight (the exact moment the customer feels the pain, the concrete result they want, the reason to believe this business) and say it in fresher, sharper words. Never reuse more than 3 consecutive words from any brief field, except proper names and the product's name.
2. Be concrete: prefer a specific scene, object, moment or detail that follows from the brief over abstractions. Never invent prices, statistics, awards, reviews or guarantees the brief doesn't support.
3. Banned words and their equivalents in the output language: "high quality", "innovative", "solution", "best", "unique", "unlock", "elevate", "seamless", "game-changer", "next level", "revolutionary", "one-stop", "we are passionate".
4. ${form.competitor.trim() ? "Contrast with the named competitor by what it lacks, not by insulting it; you may describe it instead of naming it." : "Contrast with the usual old way customers solve this today."}
5. Call to action: ${form.cta.trim() ? "keep the intent of the desired CTA but make it sharper and more specific." : "choose the most natural next step for this business (message, order, book, visit)."}
6. Every piece must sound like it belongs to the same brand, but no two pieces should reuse the same sentence.${avoidBlock}

Reply with only one JSON object with these keys:
${specs}`;
}

function asStr(v) { return typeof v === "string" ? v.trim() : ""; }

// Validates and normalizes whatever sections came back from the model.
function normalizeSections(raw, sections) {
  const out = {};
  if (!raw || typeof raw !== "object") return out;
  if (sections.includes("uvp") && Array.isArray(raw.uvp)) {
    const u = raw.uvp.map((x) => (typeof x === "string" ? { label: "", text: x.trim() } : { label: asStr(x && x.label), text: asStr(x && x.text) }))
      .filter((x) => x.text);
    if (u.length) out.uvp = u.slice(0, 3);
  }
  if (sections.includes("ig") && asStr(raw.ig)) out.ig = asStr(raw.ig);
  if (sections.includes("tiktok") && asStr(raw.tiktok)) out.tiktok = asStr(raw.tiktok);
  if (sections.includes("hero") && raw.hero && asStr(raw.hero.h1)) {
    out.hero = { h1: asStr(raw.hero.h1), h2: asStr(raw.hero.h2), cta: asStr(raw.hero.cta) };
  }
  if (sections.includes("hooks") && Array.isArray(raw.hooks)) {
    const h = raw.hooks.map(asStr).filter(Boolean);
    if (h.length) out.hooks = h.slice(0, 5);
  }
  if (sections.includes("ads") && raw.ads && (asStr(raw.ads.pas) || asStr(raw.ads.aida))) {
    out.ads = { pas: asStr(raw.ads.pas), aida: asStr(raw.ads.aida) };
  }
  return out;
}

function sectionAsText(gen, key) {
  if (!gen) return "";
  switch (key) {
    case "uvp": return (gen.uvp || []).map((u) => "- " + u.text).join("\n");
    case "ig": return gen.ig || "";
    case "tiktok": return gen.tiktok || "";
    case "hero": return gen.hero ? `H1: ${gen.hero.h1}\nH2: ${gen.hero.h2}\nCTA: ${gen.hero.cta}` : "";
    case "hooks": return (gen.hooks || []).map((h) => "- " + h).join("\n");
    case "ads": return gen.ads ? `PAS: ${gen.ads.pas}\nAIDA: ${gen.ads.aida}` : "";
    default: return "";
  }
}

function localGenerate(form, lang, seeds) {
  const p = templatePools(form, lang);
  const s = (k) => seeds[k] || 0;
  return {
    uvp: rotate(p.uvp, s("uvp"), 3),
    ig: p.ig[s("ig") % p.ig.length],
    tiktok: p.tiktok[s("tiktok") % p.tiktok.length],
    hero: p.hero[s("hero") % p.hero.length],
    hooks: rotate(p.hooks, s("hooks"), 5),
    ads: p.ads[s("ads") % p.ads.length],
  };
}

function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* ignore */ } }

function useCapability(name) {
  const [state, setState] = useState({ status: "checking", api: null });
  useEffect(() => {
    let alive = true;
    if (!window.claude || typeof window.claude.use !== "function") {
      setState({ status: "off", api: null });
      return;
    }
    window.claude.use(name)
      .then((api) => { if (alive) setState({ status: api ? "on" : "off", api }); })
      .catch(() => { if (alive) setState({ status: "off", api: null }); });
    return () => { alive = false; };
  }, [name]);
  return [state, setState];
}

const EMPTY_FORM = {
  industry: "", target: "", pain: "", product: "", benefit: "", differentiator: "",
  tone: "friendly", cta: "", competitor: "",
};

/* ============================== SMALL COMPONENTS ============================== */

function Field({ label, index, children }) {
  return (
    <div className="mb-4">
      <label className="flex items-baseline gap-2 mb-1.5">
        {index && <span className="field-num">{index}</span>}
        <span className="text-sm font-medium" style={{ color: "var(--ink)" }}>{label}</span>
      </label>
      {children}
    </div>
  );
}

const inputCls = "w-full rounded-md border px-3 py-2 text-sm transition-colors focus:border-[var(--wine)]";

function CopyButton({ text, label, copiedLabel }) {
  const [copied, setCopied] = useState(false);
  const tRef = useRef(null);
  const doCopy = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      }
      setCopied(true);
      clearTimeout(tRef.current);
      tRef.current = setTimeout(() => setCopied(false), 1600);
    } catch (e) { /* ignore */ }
  };
  useEffect(() => () => clearTimeout(tRef.current), []);
  return (
    <button onClick={doCopy} className="text-xs font-medium px-2.5 py-1 rounded-md border transition-colors shrink-0"
      style={{ borderColor: copied ? "var(--sage)" : "var(--line)", color: copied ? "var(--sage)" : "var(--ink-soft)" }}>
      {copied ? copiedLabel : label}
    </button>
  );
}

function OutputBlock({ title, text, t, children }) {
  return (
    <div className="rounded-lg border p-4" style={{ borderColor: "var(--line)", background: "var(--bg-panel)", boxShadow: "var(--shadow)" }}>
      <div className="flex items-start justify-between gap-3 mb-2">
        <h3 className="text-sm font-semibold" style={{ color: "var(--wine)" }}>{title}</h3>
        <CopyButton text={text} label={t.copy} copiedLabel={t.copied} />
      </div>
      {children}
    </div>
  );
}

function Para({ text, cls, color }) {
  return <p className={`${cls || "text-sm leading-relaxed"} whitespace-pre-line`} style={{ color: color || "var(--ink)" }}>{text}</p>;
}

/* ============================== MAIN APP ============================== */

function App() {
  const [uiLang, setUiLang] = useState(() => safeGet("uvp_uiLang") || "en");
  const [outputLang, setOutputLang] = useState(() => safeGet("uvp_outputLang") || "en");
  const [theme, setTheme] = useState(() => (window.hubTheme && window.hubTheme.get()) || safeGet("uvp_theme") || "light");
  useEffect(() => (window.hubTheme ? window.hubTheme.subscribe((th) => { if (th) setTheme(th); }) : undefined), []);
  const [form, setForm] = useState(() => {
    const saved = safeGet("uvp_form_draft");
    if (saved) { try { return { ...EMPTY_FORM, ...JSON.parse(saved) }; } catch (e) { /* ignore */ } }
    return EMPTY_FORM;
  });
  const [generated, setGenerated] = useState(null);
  const [genLang, setGenLang] = useState(null);
  const [activeTab, setActiveTab] = useState("uvp");
  const [attempted, setAttempted] = useState(false);
  const [busy, setBusy] = useState(null); // null | "all" | section key
  const [notice, setNotice] = useState("");
  const [seeds, setSeeds] = useState({});
  const [useLocal, setUseLocal] = useState(false);

  const [sampleCap] = useCapability("sample");
  const [dlCap] = useCapability("downloads");
  const ctlRef = useRef(null);
  const snapshotRef = useRef("");
  const genRef = useRef(null);
  genRef.current = generated;

  const t = UI[uiLang];
  const aiMode = sampleCap.status === "on" && !useLocal;
  const mode = useLocal || sampleCap.status === "off" ? "local" : sampleCap.status === "checking" ? "checking" : "ai";

  useEffect(() => { safeSet("uvp_uiLang", uiLang); }, [uiLang]);
  useEffect(() => { safeSet("uvp_outputLang", outputLang); }, [outputLang]);
  useEffect(() => { safeSet("uvp_theme", theme); }, [theme]);
  useEffect(() => { safeSet("uvp_form_draft", JSON.stringify(form)); }, [form]);

  const isValidForm = (f) => REQUIRED.every((k) => f[k].trim().length > 0);
  const isValid = isValidForm(form);
  const snap = (f, l) => JSON.stringify([f, l]);

  // Offline mode: copy follows every edit instantly once something has been generated.
  useEffect(() => {
    if (mode !== "local" || !genRef.current || !isValid) return;
    setGenerated(localGenerate(form, outputLang, seeds));
    setGenLang(outputLang);
  }, [form, outputLang, seeds, mode]);

  const handleSampleError = (err) => {
    const code = err && err.code;
    if (code === "cancelled") return;
    if (code === "not_granted" || code === "capability_disabled" || code === "capability_removed" || code === "unavailable") {
      setUseLocal(true);
      setNotice("errDeclined");
      return;
    }
    setNotice(code === "rate_limited" ? "errRate" : "errGeneric");
  };

  const runAi = async (f, lang, sections, avoid) => {
    if (ctlRef.current) ctlRef.current.abort();
    const ctl = new AbortController();
    ctlRef.current = ctl;
    setBusy(sections.length > 1 ? "all" : sections[0]);
    setNotice("");
    try {
      const raw = await sampleCap.api.json(buildPrompt(f, lang, sections, avoid), {
        signal: ctl.signal, modelTier: "default", cache: !avoid,
      });
      if (ctlRef.current !== ctl) return;
      const parsed = normalizeSections(raw, sections);
      if (!Object.keys(parsed).length) { setNotice("errGeneric"); return; }
      if (sections.length > 1) {
        setGenerated(parsed);
        setGenLang(lang);
        snapshotRef.current = snap(f, lang);
      } else {
        setGenerated((g) => ({ ...(g || {}), ...parsed }));
      }
    } catch (err) {
      if (ctlRef.current === ctl) handleSampleError(err);
    } finally {
      if (ctlRef.current === ctl) { setBusy(null); ctlRef.current = null; }
    }
  };

  const generateAll = (f = form, lang = outputLang) => {
    if (!isValidForm(f)) return;
    if (aiMode) {
      runAi(f, lang, SECTIONS, null);
    } else {
      setGenerated(localGenerate(f, lang, seeds));
      setGenLang(lang);
      snapshotRef.current = snap(f, lang);
    }
  };

  const handleGenerate = () => {
    setAttempted(true);
    if (!isValid) return;
    setActiveTab((tab) => tab || "uvp");
    generateAll();
  };

  // Called after a discrete change (tone, CTA field blur, language switch).
  const autoUpdate = (f, lang) => {
    if (!genRef.current || !isValidForm(f)) return;
    if (mode !== "ai") return; // offline mode already follows edits live
    if (snapshotRef.current === snap(f, lang)) return;
    runAi(f, lang, SECTIONS, null);
  };

  const moreIdeas = (key) => {
    if (!generated) return;
    if (aiMode) {
      runAi(form, genLang || outputLang, [key], sectionAsText(generated, key));
    } else {
      setSeeds((s) => ({ ...s, [key]: (s[key] || 0) + 1 }));
    }
  };

  const stop = () => { if (ctlRef.current) { ctlRef.current.abort(); ctlRef.current = null; } setBusy(null); };

  const handleReset = () => {
    stop();
    setForm(EMPTY_FORM);
    setGenerated(null);
    setAttempted(false);
    setSeeds({});
    setNotice("");
    snapshotRef.current = "";
  };

  const update = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));
  const onBlurField = () => autoUpdate(form, outputLang);
  const onToneChange = (e) => {
    const f = { ...form, tone: e.target.value };
    setForm(f);
    autoUpdate(f, outputLang);
  };
  const onOutputLang = (code) => {
    setOutputLang(code);
    autoUpdate(form, code);
  };

  const handleDownloadCsv = async () => {
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const rows = [["section", "field", "value"]];
    REQUIRED.concat(["tone", "cta", "competitor"]).forEach((k) => rows.push(["input", k, form[k]]));
    rows.push(["input", "output_language", genLang || outputLang]);
    if (generated) {
      (generated.uvp || []).forEach((u, i) => rows.push(["uvp", `variation_${i + 1}${u.label ? " (" + u.label + ")" : ""}`, u.text]));
      rows.push(["instagram_bio", "text", generated.ig]);
      rows.push(["tiktok_bio", "text", generated.tiktok]);
      if (generated.hero) { rows.push(["hero", "h1", generated.hero.h1]); rows.push(["hero", "h2", generated.hero.h2]); rows.push(["hero", "cta", generated.hero.cta]); }
      (generated.hooks || []).forEach((h, i) => rows.push(["hook", `hook_${i + 1}`, h]));
      if (generated.ads) { rows.push(["ad", "pas", generated.ads.pas]); rows.push(["ad", "aida", generated.ads.aida]); }
    }
    const csv = "\uFEFF" + rows.map((r) => r.map(esc).join(",")).join("\r\n");
    const filename = "uvp-marketing-copy.csv";
    if (dlCap.api) {
      try {
        await dlCap.api.save({ filename, data: new Blob([csv], { type: "text/csv" }) });
        setNotice("csvSaved");
      } catch (err) {
        setNotice(err && err.code === "declined" ? "csvDeclined" : "csvUnavailable");
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const langPill = (current, onPick) => (
    <div className="inline-flex flex-wrap rounded-full border p-0.5" style={{ borderColor: "var(--line)" }}>
      {LANGS.map((code) => (
        <button key={code} onClick={() => onPick(code)} aria-pressed={current === code}
          className="text-xs font-medium px-2.5 py-1 rounded-full transition-colors"
          style={{ background: current === code ? "var(--wine)" : "transparent", color: current === code ? "var(--bg-panel)" : "var(--ink-soft)" }}>
          {UI[code].langName}
        </button>
      ))}
    </div>
  );

  const outT = UI[genLang || outputLang];
  const g = generated || {};
  const sectionBusy = busy && busy !== "all";

  const MoreButton = ({ k }) => (
    <button onClick={() => moreIdeas(k)} disabled={!!busy}
      className="w-full rounded-md border border-dashed px-4 py-2.5 text-sm font-medium transition-colors disabled:opacity-50"
      style={{ borderColor: "var(--line-strong)", color: "var(--wine)" }}>
      {busy === k ? t.writingSection : `\u21BB  ${t.moreIdeas}`}
    </button>
  );

  const modeText = mode === "ai" ? t.modeAi : mode === "checking" ? t.modeChecking : t.modeLocal;

  return (
    <div data-theme={theme} style={{ background: "var(--bg)" }} className="min-h-screen">
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6">

        <header className="flex flex-col gap-4 pb-5 mb-6 border-b" style={{ borderColor: "var(--line)" }}>
          <div className="flex flex-wrap items-start justify-between gap-4">
            <div className="max-w-2xl">
              <h1 className="font-serif-display text-2xl sm:text-[1.7rem] font-semibold leading-tight">{t.appTitle}</h1>
              <p className="text-sm mt-1.5" style={{ color: "var(--ink-soft)" }}>{t.appSubtitle}</p>
            </div>
            <button onClick={() => setTheme((th) => (th === "light" ? "dark" : "light"))}
              className="uvp-theme-toggle text-xs font-medium px-3 py-1.5 rounded-full border shrink-0"
              style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }} aria-label={t.theme}>
              {theme === "light" ? `\u263C  ${t.themeLight}` : `\u263E  ${t.themeDark}`}
            </button>
          </div>
          <div className="flex flex-wrap items-center gap-x-8 gap-y-3">
            <div>
              <div className="text-xs font-medium mb-1.5" style={{ color: "var(--ink-faint)" }}>{t.interfaceLabel}</div>
              {langPill(uiLang, setUiLang)}
            </div>
            <div>
              <div className="text-xs font-medium mb-1.5" style={{ color: "var(--ink-faint)" }}>{t.outputLabel}</div>
              {langPill(outputLang, onOutputLang)}
            </div>
          </div>
          <p className="text-xs flex items-center gap-2" style={{ color: mode === "ai" ? "var(--sage)" : "var(--ink-faint)" }}>
            <span className="inline-block w-2 h-2 rounded-full" style={{ background: mode === "ai" ? "var(--sage)" : "var(--line-strong)" }} />
            {modeText}
          </p>
        </header>

        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,380px)_1fr] gap-6 items-start">

          {/* FORM */}
          <div className="rounded-xl border p-5 lg:sticky lg:top-6" style={{ borderColor: "var(--line)", background: "var(--bg-panel)", boxShadow: "var(--shadow)" }}>
            <h2 className="font-serif-display text-lg font-semibold" style={{ color: "var(--wine)" }}>{t.sectionA}</h2>
            <p className="text-xs mt-0.5 mb-4" style={{ color: "var(--ink-faint)" }}>{t.sectionAHint}</p>

            {[
              ["industry", "input"], ["target", "input"], ["pain", "area"],
              ["product", "area"], ["benefit", "area"], ["differentiator", "area"],
            ].map(([k, kind], i) => (
              <Field key={k} label={t[k]} index={String(i + 1)}>
                {kind === "input"
                  ? <input value={form[k]} onChange={update(k)} onBlur={onBlurField} placeholder={t[k + "Ph"]} className={inputCls} style={{ borderColor: "var(--line)" }} />
                  : <textarea rows={2} value={form[k]} onChange={update(k)} onBlur={onBlurField} placeholder={t[k + "Ph"]} className={inputCls + " resize-none"} style={{ borderColor: "var(--line)" }} />}
              </Field>
            ))}

            {attempted && !isValid && (
              <p className="text-xs mb-3 -mt-1" style={{ color: "var(--wine)" }}>{t.requiredNotice}</p>
            )}

            <div className="my-5 border-t" style={{ borderColor: "var(--line)" }} />

            <h2 className="font-serif-display text-lg font-semibold" style={{ color: "var(--wine)" }}>{t.sectionB}</h2>
            <p className="text-xs mt-0.5 mb-4" style={{ color: "var(--ink-faint)" }}>{t.sectionBHint}</p>

            <Field label={t.tone}>
              <select value={form.tone} onChange={onToneChange} className={inputCls} style={{ borderColor: "var(--line)" }}>
                {Object.entries(t.toneOptions).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </Field>
            <Field label={t.cta}>
              <input value={form.cta} onChange={update("cta")} onBlur={onBlurField} placeholder={t.ctaPh} className={inputCls} style={{ borderColor: "var(--line)" }} />
            </Field>
            <Field label={t.competitor}>
              <input value={form.competitor} onChange={update("competitor")} onBlur={onBlurField} placeholder={t.competitorPh} className={inputCls} style={{ borderColor: "var(--line)" }} />
            </Field>

            <div className="flex flex-wrap gap-2 mt-2">
              <button onClick={handleGenerate} disabled={busy === "all"}
                className="flex-1 rounded-md px-4 py-2.5 text-sm font-semibold transition-opacity hover:opacity-90 disabled:opacity-60"
                style={{ background: "var(--wine)", color: "var(--bg-panel)" }}>
                {busy === "all" ? t.writingSection : t.generate}
              </button>
              <button onClick={handleReset} className="rounded-md px-3 py-2.5 text-sm font-medium border" style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                {t.reset}
              </button>
            </div>
            <p className="text-[0.7rem] mt-3 leading-relaxed" style={{ color: "var(--ink-faint)" }}>{t.autoNote} {t.draftSaved}</p>
          </div>

          {/* OUTPUT */}
          <div>
            {notice && (
              <div role="status" className="mb-4 rounded-md border px-3 py-2 text-sm"
                style={{ borderColor: notice.startsWith("csvSaved") ? "var(--sage)" : "var(--gold)", color: "var(--ink)", background: "var(--bg-panel)" }}>
                {t[notice]}
              </div>
            )}

            {!generated && busy !== "all" && (
              <div className="rounded-xl border p-10 text-center flex flex-col items-center justify-center min-h-[360px]" style={{ borderColor: "var(--line)", background: "var(--bg-panel-2)" }}>
                <div className="text-3xl mb-3" aria-hidden="true">{"\u270D\uFE0F"}</div>
                <h3 className="font-serif-display text-lg font-semibold mb-1.5">{t.emptyTitle}</h3>
                <p className="text-sm max-w-md" style={{ color: "var(--ink-soft)" }}>{t.emptyBody}</p>
              </div>
            )}

            {busy === "all" && (
              <div className="rounded-xl border p-8 mb-4 flex flex-col items-center gap-4 text-center" style={{ borderColor: "var(--line)", background: "var(--bg-panel-2)" }}>
                <div className="w-full max-w-md flex flex-col gap-2" aria-hidden="true">
                  {[92, 78, 85, 60].map((w, i) => (
                    <div key={i} className="h-2.5 rounded-full animate-pulse" style={{ width: w + "%", background: "var(--line)" }} />
                  ))}
                </div>
                <p className="text-sm" style={{ color: "var(--ink-soft)" }}>{t.writing}</p>
                <button onClick={stop} className="text-xs font-medium px-3 py-1.5 rounded-md border" style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>{t.stop}</button>
              </div>
            )}

            {generated && (
              <div style={{ opacity: busy === "all" ? 0.45 : 1 }}>
                <div className="flex flex-wrap items-end gap-1 mb-5 border-b" style={{ borderColor: "var(--line)" }}>
                  {SECTIONS.map((k) => (
                    <button key={k} onClick={() => setActiveTab(k)}
                      className={`tab-underline px-3.5 py-2 text-sm font-medium ${activeTab === k ? "active" : ""}`}
                      style={{ color: activeTab === k ? "var(--wine)" : "var(--ink-soft)" }}>
                      {t.tabs[k]}
                    </button>
                  ))}
                  <div className="ml-auto pb-1.5">
                    <button onClick={handleDownloadCsv} className="text-xs font-medium px-3 py-1.5 rounded-md border" style={{ borderColor: "var(--line)", color: "var(--sage)" }}>
                      {t.downloadCsv}
                    </button>
                  </div>
                </div>

                <div className="flex flex-col gap-3" style={{ opacity: busy === activeTab ? 0.5 : 1 }}>
                  {activeTab === "uvp" && (g.uvp || []).map((u, i) => (
                    <OutputBlock key={i} t={t} text={u.text} title={`${outT.uvpVariant} ${i + 1}${u.label ? " · " + u.label : ""}`}>
                      <Para text={u.text} />
                    </OutputBlock>
                  ))}

                  {activeTab === "ig" && g.ig && (
                    <OutputBlock t={t} title={outT.tabs.ig} text={g.ig}>
                      <Para text={g.ig} />
                      <p className="text-xs mt-2" style={{ color: g.ig.length > 150 ? "var(--wine)" : "var(--ink-faint)" }}>{g.ig.length} / 150</p>
                    </OutputBlock>
                  )}

                  {activeTab === "tiktok" && g.tiktok && (
                    <OutputBlock t={t} title={outT.tabs.tiktok} text={g.tiktok}>
                      <Para text={g.tiktok} />
                      <p className="text-xs mt-2" style={{ color: g.tiktok.length > 80 ? "var(--wine)" : "var(--ink-faint)" }}>{g.tiktok.length} / 80</p>
                    </OutputBlock>
                  )}

                  {activeTab === "hero" && g.hero && (
                    <>
                      <div className="rounded-lg border p-6" style={{ borderColor: "var(--line)", background: "var(--bg-panel-2)" }}>
                        <p className="font-serif-display text-2xl font-semibold leading-snug mb-2">{g.hero.h1}</p>
                        <p className="text-sm leading-relaxed mb-4 max-w-xl" style={{ color: "var(--ink-soft)" }}>{g.hero.h2}</p>
                        <span className="inline-block text-sm font-semibold px-4 py-2 rounded-md" style={{ background: "var(--wine)", color: "var(--bg-panel)" }}>{g.hero.cta}</span>
                      </div>
                      <OutputBlock t={t} title={outT.heroH1} text={g.hero.h1}><Para text={g.hero.h1} /></OutputBlock>
                      <OutputBlock t={t} title={outT.heroH2} text={g.hero.h2}><Para text={g.hero.h2} /></OutputBlock>
                      <OutputBlock t={t} title={outT.heroCta} text={g.hero.cta}><Para text={g.hero.cta} /></OutputBlock>
                    </>
                  )}

                  {activeTab === "hooks" && (g.hooks || []).map((h, i) => (
                    <OutputBlock key={i} t={t} title={`${outT.hook} ${i + 1}`} text={h}><Para text={h} /></OutputBlock>
                  ))}

                  {activeTab === "ads" && g.ads && (
                    <>
                      <OutputBlock t={t} title={outT.adPas} text={g.ads.pas}><Para text={g.ads.pas} /></OutputBlock>
                      <OutputBlock t={t} title={outT.adAida} text={g.ads.aida}><Para text={g.ads.aida} /></OutputBlock>
                    </>
                  )}

                  <MoreButton k={activeTab} />
                  {sectionBusy && busy === activeTab && (
                    <button onClick={stop} className="self-center text-xs font-medium px-3 py-1 rounded-md border" style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>{t.stop}</button>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>

        <footer className="mt-10 pt-5 border-t text-center" style={{ borderColor: "var(--line)" }}>
          <p className="text-xs" style={{ color: "var(--ink-faint)" }}>{t.footer}</p>
        </footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
